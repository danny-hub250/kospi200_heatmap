<style>
  :root{--bg:#0a0a0c;--panel:#141418;--border:#26262e;--text:#e8e8ec;--muted:#7a7a86;--accent:#e0392b;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0;flex-wrap:wrap;}
  header .brand{font-weight:700;font-size:14px;letter-spacing:.02em;white-space:nowrap;}
  header .brand span{color:var(--accent);}
  header .date{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap;}
  header .market{font-size:10px;padding:2px 7px;border-radius:20px;border:1px solid var(--border);color:var(--muted);white-space:nowrap;}
  header .market.open{color:#2ecc71;border-color:#2ecc71;}
  header .status{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);}
  header .dot{width:8px;height:8px;border-radius:50%;background:#444;transition:background .3s;flex-shrink:0;}
  header .dot.live{background:#2ecc71;box-shadow:0 0 6px #2ecc71;animation:pulse 2s infinite;}
  header .dot.err{background:#e74c3c;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
  header button{background:transparent;border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:8px;font-size:12px;cursor:pointer;min-height:34px;}
  header button:active{background:#22222a;}
  #chart{flex:1;position:relative;overflow:hidden;}
  svg{display:block;width:100%;height:100%;}
  .sector-label{fill:rgba(255,255,255,.72);font-size:11px;font-weight:700;letter-spacing:.05em;pointer-events:none;}
  .cell{cursor:pointer;}
  .cell text{pointer-events:none;}
  #tip{position:absolute;pointer-events:none;background:rgba(15,15,20,.97);border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-size:13px;opacity:0;transition:opacity .12s;box-shadow:0 8px 28px rgba(0,0,0,.6);z-index:10;min-width:150px;}
  #tip .t-sym{font-weight:700;font-size:15px;}
  #tip .t-name{color:var(--muted);font-size:11px;margin-bottom:7px;}
  #tip .t-row{display:flex;justify-content:space-between;gap:16px;font-variant-numeric:tabular-nums;}
  #tip .t-row span:last-child{font-weight:600;}
  footer{display:flex;align-items:center;gap:6px;padding:8px 14px;border-top:1px solid var(--border);background:var(--panel);font-size:11px;color:var(--muted);flex-shrink:0;flex-wrap:wrap;}
  .legend-bar{display:flex;height:12px;border-radius:3px;overflow:hidden;}
  .legend-bar div{width:22px;}
  #lastUpdate{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;}
</style>
</head>

  <header>

 {c:"015760",n:"한국전력",sector:"에너지·유틸리티",w:7},{c:"036460",n:"한국가스공사",sector:"에너지·유틸리티",w:3},
 {c:"010950",n:"S-Oil",sector:"에너지·유틸리티",w:10},{c:"051600",n:"한전KPS",sector:"에너지·유틸리티",w:2},
 {c:"052690",n:"한전기술",sector:"에너지·유틸리티",w:2},{c:"088980",n:"맥쿼리인프라",sector:"에너지·유틸리티",w:2},
 {c:"336260",n:"두산퓨얼셀",sector:"에너지·유틸리티",w:2},
];

// 상승=빨강, 하락=파랑 (국내 증시 관례)
const colorScale=d3.scaleLinear().domain([-4,-1.5,0,1.5,4]).range(["#1565c0","#1b3a5c","#2b2b30","#7a2320","#e0392b"]).clamp(true);
(function(){const bar=document.getElementById("legendBar");for(let p=-4;p<=4;p+=2/3){const d=document.createElement("div");d.style.background=colorScale(p);bar.appendChild(d);}})();

// 1 weight당 대략 이 정도 시총(원)으로 간주 — 데이터 로딩 전 첫 화면이나, 그 종목만
// 조회에 실패했을 때만 쓰이는 임시 스케일이다(1조 원/weight).실제 크기는 항상
// quotes[].cap(marketValueFullRaw)이 로드되는 즉시 그 값으로 대체된다.
const FALLBACK_CAP_PER_WEIGHT=1e12;

function formatCap(krw){
 if(krw==null||Number.isNaN(krw))return null;
 const jo=Math.floor(krw/1e12);
 const eok=Math.floor((krw%1e12)/1e8);
 if(jo>0)return `${jo.toLocaleString("ko-KR")}조 ${eok.toLocaleString("ko-KR")}억원`;
 return `${eok.toLocaleString("ko-KR")}억원`;
}

const tip=document.getElementById("tip"),chartEl=document.getElementById("chart");
let tipTimer=null;

function render(quotes){
 const w=chartEl.clientWidth,h=chartEl.clientHeight;
 const portrait = h > w;
 d3.select("#chart svg").remove();
 const svg=d3.select("#chart").append("svg").attr("width",w).attr("height",h);
 const bySector=d3.group(STOCKS,d=>d.sector);
 // 상자 크기 = 실시간 시가총액(marketValueFullRaw). 아직 로딩 전이거나 그 종목만
 // 조회 실패한 경우엔 STOCKS의 정적 w 값을 대략적인 시총 스케일로 환산해 대체한다.
 const root=d3.hierarchy({children:Array.from(bySector,([sector,items])=>({sector,children:items}))}).sum(d=>{const q=quotes[d.c];return(q&&q.cap!=null&&!Number.isNaN(q.cap))?q.cap:d.w*FALLBACK_CAP_PER_WEIGHT;}).sort((a,b)=>b.value-a.value);
 d3.treemap()
   .tile(portrait ? d3.treemapSliceDice : d3.treemapSquarify)
   .size([w,h]).paddingOuter(4).paddingTop(20).paddingInner(1.5).round(true)(root);
 svg.selectAll(".sector-label").data(root.children).join("text").attr("class","sector-label").attr("x",d=>d.x0+5).attr("y",d=>d.y0+13).text(d=>d.data.sector);
 const cell=svg.selectAll(".cell").data(root.leaves()).join("g").attr("class","cell").attr("transform",d=>`translate(${d.x0},${d.y0})`);
 cell.append("rect").attr("width",d=>Math.max(0,d.x1-d.x0)).attr("height",d=>Math.max(0,d.y1-d.y0)).attr("rx",2).attr("fill",d=>{const q=quotes[d.data.c];return(q&&q.dp!=null)?colorScale(q.dp):"#2b2b30";}).attr("stroke","rgba(0,0,0,0.35)").attr("stroke-width",1);
 cell.each(function(d){const bw=d.x1-d.x0,bh=d.y1-d.y0;if(bw<28||bh<16)return;const q=quotes[d.data.c];const dp=(q&&q.dp!=null)?q.dp:null;const g=d3.select(this);const fs=Math.max(9,Math.min(bw/4.6,bh/3,20));
  g.append("text").attr("x",bw/2).attr("y",bh/2-(bh>32?fs*0.25:0)).attr("text-anchor","middle").attr("dominant-baseline","middle").attr("fill","#fff").attr("font-weight",700).attr("font-size",fs).text(d.data.n);
  if(bh>32&&dp!=null){g.append("text").attr("x",bw/2).attr("y",bh/2+fs*0.75).attr("text-anchor","middle").attr("dominant-baseline","middle").attr("fill","rgba(255,255,255,0.85)").attr("font-size",Math.max(8,fs*0.5)).text((dp>=0?"+":"")+dp.toFixed(2)+"%");}});
 cell.on("click",function(event,d){
  const q=quotes[d.data.c];const dp=q&&q.dp!=null?q.dp:null;const price=q&&q.c!=null?q.c:null;const capText=formatCap(q&&q.cap!=null?q.cap:null);
  tip.innerHTML=`<div class="t-sym">${d.data.n}</div><div class="t-name">${d.data.c}</div>`+(price!=null?`<div class="t-row"><span>현재가</span><span>${price.toLocaleString("ko-KR")}원</span></div>`:"")+(dp!=null?`<div class="t-row"><span>등락률</span><span style="color:${dp>=0?'#e0392b':'#1565c0'}">${dp>=0?'+':''}${dp.toFixed(2)}%</span></div>`:`<div class="t-row"><span>데이터</span><span>-</span></div>`)+(capText?`<div class="t-row"><span>시가총액</span><span>${capText}</span></div>`:"");
  tip.style.opacity=1;
  const r=chartEl.getBoundingClientRect();
  let x=event.clientX-r.left+12,y=event.clientY-r.top+12;
  const tw=tip.offsetWidth,th=tip.offsetHeight;
  if(x+tw>r.width)x=event.clientX-r.left-tw-12;
  if(y+th>r.height)y=event.clientY-r.top-th-12;
  tip.style.left=Math.max(4,x)+"px";tip.style.top=Math.max(4,y)+"px";
  clearTimeout(tipTimer);tipTimer=setTimeout(()=>{tip.style.opacity=0;},2500);
 });
}

function setStatus(cls){document.getElementById("dot").className="dot"+(cls?" "+cls:"");}

// 프록시 응답이 오지 않고 계속 붙잡고 있는 경우를 대비해 요청마다 타임아웃을 건다.
async function fetchWithTimeout(url,ms){
 const ctrl=new AbortController();
 const timer=setTimeout(()=>ctrl.abort(),ms);
 try{
  return await fetch(url,{cache:"no-store",signal:ctrl.signal});
 }finally{
  clearTimeout(timer);
 }
}

async function fetchViaProxy(targetUrl){
 let lastErr;
 for(const build of PROXY_BUILDERS){
  const reqUrl=build(targetUrl);
  try{
   const res=await fetchWithTimeout(reqUrl,8000);
   if(!res.ok)throw new Error("HTTP "+res.status);
   const data=await res.json();
   if(data)return data;
  }catch(e){
   lastErr=e;
   console.warn("[KOSPI200] 요청 실패:",reqUrl,e&&e.message?e.message:e);
  }
 }
 throw lastErr||new Error("모든 프록시 호출 실패");
}

// 실제 응답 형태(2026-08 기준, Worker로 직접 확인):
// { "pollingInterval":7000, "datas":[ { "itemCode":"005930",
//   "closePriceRaw":"269500", "fluctuationsRatioRaw":"5.48",
//   "compareToPreviousPrice":{"code":"2","text":"상승","name":"RISING"}, ... } ], "time":"..." }
// code: 1=상한,2=상승,3=보합,4=하락,5=하한. fluctuationsRatioRaw/closePriceRaw 자체에는
// 부호가 없어서(항상 양수 문자열) compareToPreviousPrice.code로 상승/하락을 판단해야 한다.
function toNumber(v){
 if(typeof v==="number")return v;
 if(typeof v==="string")return parseFloat(v.replace(/,/g,""));
 return NaN;
}
async function fetchBatch(codes){
 const url=`https://polling.finance.naver.com/api/realtime/domestic/stock/${codes.join(",")}`;
 const data=await fetchViaProxy(url);
 const out={};
 const items=(data&&data.datas)||[];
 for(const d of items){
  if(!d||!d.itemCode)continue;
  let dp=toNumber(d.fluctuationsRatioRaw!=null?d.fluctuationsRatioRaw:d.fluctuationsRatio);
  if(Number.isNaN(dp))continue;
  const dir=d.compareToPreviousPrice&&d.compareToPreviousPrice.code;
  if((dir==="4"||dir==="5")&&dp>0)dp=-dp;
  const price=toNumber(d.closePriceRaw!=null?d.closePriceRaw:d.closePrice);
  const cap=toNumber(d.marketValueFullRaw!=null?d.marketValueFullRaw:d.marketValueFull);
  out[d.itemCode]={c:price,dp,cap:Number.isNaN(cap)?null:cap};
 }
 return out;
}

const quotes={};
async function loadAll(){
 document.getElementById("lastUpdate").textContent="불러오는 중…";setStatus("live");
 const batchSize=40,delayMs=350;let failed=0;
 const codes=STOCKS.map(s=>s.c);
 for(let i=0;i<codes.length;i+=batchSize){
  const batch=codes.slice(i,i+batchSize);
  try{
   const res=await fetchBatch(batch);
   Object.assign(quotes,res);
   failed+=batch.filter(c=>!res[c]).length;
  }catch(e){failed+=batch.length;console.warn("[KOSPI200] 배치 실패:",batch,e&&e.message?e.message:e);}
  render(quotes);
  if(i+batchSize<codes.length)await new Promise(r=>setTimeout(r,delayMs));
 }
 const time=new Date().toLocaleTimeString("ko-KR");
 if(failed>=STOCKS.length){
  document.getElementById("lastUpdate").textContent=`${time} 시세 조회 실패 (콘솔 로그 확인)`;
  setStatus("err");
 }else{
  document.getElementById("lastUpdate").textContent=time+(failed?` (${failed} 실패)`:"");
  setStatus(failed>STOCKS.length*0.5?"err":"live");
 }
}

function initDate(){
 const d=new Date();const days=["일","월","화","수","목","금","토"];
 document.getElementById("date").textContent=`${d.getMonth()+1}/${d.getDate()} ${days[d.getDay()]}`;
 const kst=new Date(d.toLocaleString("en-US",{timeZone:"Asia/Seoul"}));
 const day=kst.getDay(),mins=kst.getHours()*60+kst.getMinutes();
 const isWeekday=day>=1&&day<=5;
 const open=isWeekday&&mins>=9*60&&mins<=15*60+30;
 const el=document.getElementById("market");
 el.textContent=open?"장중":"장마감";
 el.className="market"+(open?" open":"");
}

initDate();render(quotes);loadAll();
document.getElementById("refresh").addEventListener("click",loadAll);
let rt;window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>render(quotes),150);});
window.addEventListener("orientationchange",()=>{setTimeout(()=>render(quotes),300);});
setInterval(loadAll,5*60*1000);
setInterval(initDate,60*1000);
</script>
